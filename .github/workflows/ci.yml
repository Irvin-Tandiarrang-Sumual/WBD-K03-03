name: CI Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      stress_profile:
        description: 'Stress test profile (quick or full)'
        required: false
        default: 'quick'
        type: choice
        options:
          - quick
          - full

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit-test:
    name: be unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run Unit Tests with Coverage
        run: |
          cd backend
          UNIT_PKGS=$(go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./...)
          go test $UNIT_PKGS -v -count=1 -coverprofile=coverage.unit.out
          go tool cover -func coverage.unit.out

  backend-integration-test:
    name: be integration tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.base_ref == 'main' || github.base_ref == 'develop'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run Integration Tests
        env:
          REQUIRE_INTEGRATION_CONTAINERS: 'true'
        run: |
          cd backend
          go test -tags=integration -v ./test/integration/... -count=1

  e2e-test:
    name: e2e tests (playwright)
    runs-on: ubuntu-latest
    needs: [backend-unit-test, backend-integration-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.base_ref == 'main' || github.base_ref == 'develop' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment File
        run: |
          cp .env.example .env

      - name: Run E2E Test Suite via Docker Compose
        env:
          BASE_URL: http://host.docker.internal:3000
          FRONTEND_ORIGIN: http://host.docker.internal:3000
          VITE_API_URL: http://host.docker.internal:8080/api/v1
        run: |
          docker compose --profile test up --build --abort-on-container-exit --exit-code-from e2e

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/

      - name: Print Container Logs on Failure
        if: failure()
        run: |
          docker compose logs --tail=100 app
          docker compose logs --tail=100 frontend
          docker compose logs --tail=100 e2e

      - name: Teardown Stack
        if: always()
        run: |
          docker compose down -v

  stress-test:
    name: stress & performance tests
    runs-on: ubuntu-latest
    needs: [backend-unit-test, backend-integration-test, e2e-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.base_ref == 'main' || github.base_ref == 'develop' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment File
        run: |
          cp .env.example .env

      - name: Start Application Stack
        run: |
          docker compose up -d --build --wait --wait-timeout 120 internal_db demo_postgres demo_mysql app

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Migration Benchmark
        run: |
          k6 run -e BASE_URL=http://localhost:8080 stress/migrations.js

      - name: Run k6 Stress Testing Suite
        run: |
          PROFILE="${{ github.event.inputs.stress_profile || 'quick' }}"
          k6 run -e BASE_URL=http://localhost:8080 -e STRESS_PROFILE="$PROFILE" stress/stress_suite.js

      - name: Print Container Logs on Failure
        if: failure()
        run: |
          docker compose logs --tail=100 app
          docker compose logs --tail=50 internal_db
          docker compose logs --tail=50 demo_postgres
          docker compose logs --tail=50 demo_mysql

      - name: Teardown Stack
        if: always()
        run: |
          docker compose down -v
