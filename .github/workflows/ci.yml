name: CI Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      stress_profile:
        description: 'Stress test profile (quick or full)'
        required: false
        default: 'quick'
        type: choice
        options:
          - quick
          - full

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit-test:
    name: be unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run Unit Tests with Coverage
        run: |
          cd backend
          UNIT_PKGS=$(go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./...)
          go test $UNIT_PKGS -v -count=1 -coverprofile=coverage.unit.out
          go tool cover -func coverage.unit.out

  backend-integration-test:
    name: be integration tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.base_ref == 'main' || github.base_ref == 'develop'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run Integration Tests
        env:
          REQUIRE_INTEGRATION_CONTAINERS: 'true'
        run: |
          cd backend
          go test -tags=integration -v ./test/integration/... -count=1

  stress-test:
    name: stress & performance tests
    runs-on: ubuntu-latest
    needs: [backend-unit-test, backend-integration-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.base_ref == 'main' || github.base_ref == 'develop' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment File
        run: |
          cp .env.example .env

      - name: Start Application Stack
        run: |
          docker compose up -d --build internal_db demo_postgres demo_mysql app

      - name: Wait for All Services to be Healthy
        run: |
          echo "Waiting for databases and backend service to become fully healthy..."
          timeout 120s bash -c 'until docker compose ps internal_db | grep -q "healthy" && docker compose ps demo_postgres | grep -q "healthy" && docker compose ps demo_mysql | grep -q "healthy" && curl -sf http://localhost:8080/health > /dev/null; do sleep 3; done'
          echo "All services are healthy and ready for stress load."

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Migration Benchmark
        run: |
          k6 run -e BASE_URL=http://localhost:8080 backend/test/stress/migrations.js

      - name: Run k6 Stress Testing Suite
        run: |
          PROFILE="${{ github.event.inputs.stress_profile || 'quick' }}"
          k6 run -e BASE_URL=http://localhost:8080 -e STRESS_PROFILE="$PROFILE" backend/test/stress/stress_suite.js

      - name: Print Container Logs on Failure
        if: failure()
        run: |
          docker compose logs --tail=100 app
          docker compose logs --tail=50 internal_db
          docker compose logs --tail=50 demo_postgres

      - name: Teardown Stack
        if: always()
        run: |
          docker compose down -v
