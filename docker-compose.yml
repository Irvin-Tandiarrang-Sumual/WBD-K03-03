services:
  internal_db:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${INTERNAL_DB_PASSWORD}
      POSTGRES_DB: ${INTERNAL_DB_NAME}
      POSTGRES_USER: ${INTERNAL_DB_USER}
    ports:
      - "${INTERNAL_DB_PORT}:${INTERNAL_DB_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 10
  demo_postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: db1_pg
      POSTGRES_USER: demo_user
      POSTGRES_PASSWORD: demo_password
    volumes:
      - ./docker/postgres-demo/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_user -d db1_pg"]
      interval: 2s
      timeout: 5s
      retries: 10
  demo_mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: db2_mysql
      MYSQL_USER: demo_user
      MYSQL_PASSWORD: demo_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - ./docker/mysql-demo/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u demo_user -pdemo_password --silent"]
      interval: 2s
      timeout: 5s
      retries: 20
  demo_postgres_extra:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: db3_pg_empty
      POSTGRES_USER: demo_user
      POSTGRES_PASSWORD: demo_password
    volumes:
      - ./docker/postgres-connections/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_user -d db3_pg_empty"]
      interval: 2s
      timeout: 5s
      retries: 10
  demo_mysql_extra:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: db5_mysql_analytics
      MYSQL_USER: demo_user
      MYSQL_PASSWORD: demo_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - ./docker/mysql-connections/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u demo_user -pdemo_password --silent"]
      interval: 2s
      timeout: 5s
      retries: 20
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - SERVER_PORT=${SERVER_PORT}
    env_file:
      - .env
    environment:
      INTERNAL_DB_HOST: internal_db
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      SEED_TEST_DATA: ${SEED_TEST_DATA:-true}
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      internal_db:
        condition: service_healthy
      demo_postgres:
        condition: service_healthy
      demo_mysql:
        condition: service_healthy
      demo_postgres_extra:
        condition: service_healthy
      demo_mysql_extra:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
