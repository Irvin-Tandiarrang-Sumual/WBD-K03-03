services:
  internal_db:
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${INTERNAL_DB_PASSWORD}
      POSTGRES_DB: ${INTERNAL_DB_NAME}
      POSTGRES_USER: ${INTERNAL_DB_USER}
    ports:
      - "${INTERNAL_DB_PORT}:${INTERNAL_DB_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 10
  demo_postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DEMO_PG_DB:-db1_pg}
      POSTGRES_USER: ${DEMO_PG_USER:-demo_user}
      POSTGRES_PASSWORD: ${DEMO_PG_PASSWORD:-demo_password}
    volumes:
      - ./docker/postgres-demo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEMO_PG_USER:-demo_user} -d ${DEMO_PG_DB:-db1_pg}"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s
  demo_mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DEMO_MYSQL_DB:-db2_mysql}
      MYSQL_USER: ${DEMO_MYSQL_USER:-demo_user}
      MYSQL_PASSWORD: ${DEMO_MYSQL_PASSWORD:-demo_password}
      MYSQL_ROOT_PASSWORD: ${DEMO_MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - ./docker/mysql-demo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u ${DEMO_MYSQL_USER:-demo_user} -p${DEMO_MYSQL_PASSWORD:-demo_password} --silent"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - SERVER_PORT=${SERVER_PORT}
    env_file:
      - .env
    environment:
      INTERNAL_DB_HOST: internal_db
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      SEED_TEST_DATA: ${SEED_TEST_DATA:-true}
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    depends_on:
      internal_db:
        condition: service_healthy
      demo_postgres:
        condition: service_healthy
      demo_mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-spa
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
