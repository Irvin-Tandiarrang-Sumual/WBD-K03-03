host: localhost:8080
info:
  contact: {}
  description: Backend API for WBD K03-03 — database management platform with user/group
    access control and migration support.
  title: WBD K03-03 API
  version: "1.0"
paths:
  /admin/databases:
    get:
      description: Returns a paginated list of all databases. Requires admin privileges.
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Databases retrieved
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.PagedResponse-internal_adapters_http_handlers_DatabaseResponse'
        "400":
          description: Invalid pagination
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.BaseResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.BaseResponse-any'
        "403":
          description: Forbidden (not admin)
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.BaseResponse-any'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.BaseResponse-any'
      security:
      - CookieAuth: []
      summary: List databases (admin)
      tags:
      - Admin - Databases
    post:
      consumes:
      - application/json
      description: Registers a new database connection. Requires admin privileges.
      parameters:
      - description: Database connection details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_http_handlers.CreateDatabaseRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Database created
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.BaseResponse-internal_adapters_http_handlers_DatabaseResponse'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.BaseResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.BaseResponse-any'
        "403":
          description: Forbidden (not admin)
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.BaseResponse-any'
        "409":
          description: Database already exists
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.BaseResponse-any'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.BaseResponse-any'
      security:
      - CookieAuth: []
      summary: Create database (admin)
      tags:
      - Admin - Databases
  /admin/databases/{id}:
    delete:
      description: Deletes a registered database by its ID. Requires admin privileges.
      parameters:
      - description: Database ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Database deleted
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.BaseResponse-any'
        "400":
          description: Invalid database ID
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.BaseResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.BaseResponse-any'
        "403":
          description: Forbidden (not admin)
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.BaseResponse-any'
        "404":
          description: Database not found
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.BaseResponse-any'
        "409":
          description: Database is in use
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.BaseResponse-any'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.BaseResponse-any'
      security:
      - CookieAuth: []
      summary: Delete database (admin)
      tags:
      - Admin - Databases
    get:
      description: Returns a database by its ID. Requires admin privileges.
      parameters:
      - description: Database ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Database retrieved
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.BaseResponse-internal_adapters_http_handlers_DatabaseResponse'
        "400":
          description: Invalid database ID
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.BaseResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.BaseResponse-any'
        "403":
          description: Forbidden (not admin)
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.BaseResponse-any'
        "404":
          description: Database not found
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.BaseResponse-any'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_Irvin-Tandiarrang-Sumual_WBD-K03-03_pkg_response.BaseResponse-any'
      security:
      - CookieAuth: []
      summary: Get database (admin)
      tags:
      - Admin - Databases
